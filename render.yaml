services:
  # Backend API + Bot
  - type: web
    name: chess-club-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: chessclub
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - fromGroup: chess-club-secrets

envVarGroups:
  - name: chess-club-secrets
    vars:
      - key: DISCORD_BOT_TOKEN
      - key: DISCORD_GUILD_ID
      - key: DISCORD_ANNOUNCEMENT_CHANNEL_ID
      - key: DISCORD_PUZZLE_CHANNEL_ID
      - key: DISCORD_RESULTS_CHANNEL_ID
      - key: DISCORD_PLAYERS_ROLE_ID
      - key: DISCORD_VERIFIED_ROLE_ID
      - key: DISCORD_CHAMPION_ROLE_ID
